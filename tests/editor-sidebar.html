<!doctype html>
<html lang="id">
<meta charset="utf-8">
<title>Sidebar & Monaco regression fixture</title>
<style>
  body { margin: 16px; background: #101a21; color: #edf0d4; font: 14px monospace; }
  button { padding: 10px; cursor: pointer; }
  pre { white-space: pre-wrap; line-height: 1.6; }
  iframe { display: block; width: 100%; height: 720px; border: 1px solid #42535b; }
</style>
<h1>Sidebar & Monaco</h1>
<p>Menjalankan game asli dengan localStorage sementara di iframe. Tidak membaca atau mengubah save pemain.</p>
<button id="run-tests">Jalankan pemeriksaan</button>
<pre id="results" role="status">Belum dijalankan.</pre>
<iframe title="Game pengujian"></iframe>
<script type="module">
  const button = document.querySelector('#run-tests');
  const output = document.querySelector('#results');
  const frame = document.querySelector('iframe');
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const waitFor = async condition => {
    const until = Date.now() + 20000;
    while (!condition()) {
      if (Date.now() > until) throw new Error('Game atau skrip tidak selesai dalam 20 detik.');
      await new Promise(resolve => setTimeout(resolve, 25));
    }
  };
  button.addEventListener('click', async () => {
    button.disabled = true;
    output.textContent = 'Memuat game terisolasi…\n';
    try {
      const html = await (await fetch('/')).text();
      const storage = `<script>
        const values = new Map();
        Object.defineProperty(window, 'localStorage', { value: {
          getItem: key => values.get(key) ?? null,
          setItem: (key, value) => values.set(key, String(value)),
          removeItem: key => values.delete(key),
          clear: () => values.clear(),
        } });
      <\/script>`;
      frame.srcdoc = html.replace('<head>', '<head><base href="/">' + storage);
      await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
      const win = frame.contentWindow;
      await waitFor(() => win.__game?.scene.isActive('GameScene') && win.__game.scene.getScene('GameScene').editorBridge?.editor);
      const doc = frame.contentDocument;
      const scene = win.__game.scene.getScene('GameScene');
      const bridge = scene.editorBridge;
      const click = selector => doc.querySelector(selector).click();
      const pass = message => { output.textContent += `PASS ${message}\n`; };

      assert(bridge.isEditorVisible && !scene.isModalOpen, 'Sidebar awal harus terbuka tanpa modal.');
      assert(doc.querySelectorAll('#panel-tabs .panel-tab').length === 4, 'Empat tab lama harus terlihat.');
      assert(!scene.panelManager.panels.has('editor-panel'), 'Monaco tidak boleh didaftarkan sebagai modal.');
      pass('Sidebar awal dan empat tab lama');

      const resizeHandle = doc.querySelector('#editor-resize-handle');
      const editorPanel = doc.querySelector('#editor-panel');
      assert(resizeHandle?.getAttribute('role') === 'separator', 'Pembatas resize tidak dapat diakses.');
      const initialSize = Number(resizeHandle.getAttribute('aria-valuenow'));
      resizeHandle.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true }));
      assert(Number(resizeHandle.getAttribute('aria-valuenow')) > initialSize, 'Tombol panah tidak memperlebar sidebar.');
      assert(Number.parseFloat(editorPanel.style.width) > 0, 'Lebar panel tidak diterapkan.');
      pass('Resize sidebar dengan keyboard');

      const first = scene.scriptManager.getActiveScript();
      bridge.editor.setValue('console.log("buffer pertama");');
      click('#btn-new-script');
      const second = scene.scriptManager.getActiveScript();
      assert(first.code === 'console.log("buffer pertama");', 'Edit sebelum pindah skrip hilang.');
      bridge.editor.setValue('console.log("buffer kedua");');
      doc.querySelectorAll('#script-tabs .script-tab')[0].click();
      assert(second.code === 'console.log("buffer kedua");', 'Buffer skrip kedua tertukar.');
      assert(bridge.editor.getValue() === first.code, 'Buffer pertama gagal dimuat.');
      pass('Autosave sebelum berganti skrip');

      click('#panel-tabs [data-tab="devices"]');
      click('#btn-toggle-editor');
      assert(!bridge.isEditorVisible && doc.querySelector('#editor-panel').inert, 'Sidebar gagal ditutup.');
      click('#btn-toggle-editor');
      assert(doc.querySelector('#tab-view-devices').style.display === 'flex', 'Toggle mengganti tab aktif.');
      pass('Toggle mempertahankan tab aktif');

      const transfer = new win.DataTransfer();
      const card = doc.querySelector(`.script-card-item[data-script-id="${first.id}"]`);
      card.dispatchEvent(new win.DragEvent('dragstart', { bubbles: true, dataTransfer: transfer }));
      const zone = doc.querySelector('.drone-card-drop-zone');
      zone.dispatchEvent(new win.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: transfer }));
      const drone = scene.deviceManager.getActiveDevice();
      assert(first.assignedDroneId === drone.id, 'Kartu gagal ditugaskan ke drone.');
      assert(doc.querySelector('.drone-card-drop-zone').textContent.includes(first.name), 'Penugasan tidak tampil di Devices.');
      click(`.btn-card-edit[data-script-id="${first.id}"]`);
      assert(bridge.editor.getValue() === first.code, 'Edit dari Devices memuat skrip yang salah.');
      pass('Drag/drop kartu dan Edit dari Devices');

      bridge.editor.setValue('console.log("sebelum"); drone.wait(0.1); console.log("sesudah");');
      click('#btn-run');
      assert(drone.scriptSandbox.isRunning, 'RUN gagal memulai interpreter.');
      await waitFor(() => !drone.scriptSandbox.isRunning);
      assert(doc.querySelector('#console-output').textContent.includes('sesudah'), 'Console atau resume aksi asinkron gagal.');
      pass('RUN, console, dan resume aksi drone');

      bridge.editor.setValue('drone.wait(2); console.log("tidak boleh muncul");');
      click('#btn-run');
      click('#btn-stop');
      assert(!drone.scriptSandbox.isRunning && drone.status === 'idle', 'STOP gagal menghentikan skrip.');
      assert(!doc.querySelector('#console-output').textContent.includes('tidak boleh muncul'), 'Skrip berjalan sesudah STOP.');
      pass('STOP');

      bridge.editor.setValue('var value = 1;\nvar = ;');
      click('#btn-run');
      assert(doc.querySelector('#console-output').textContent.includes('Line 2: Error:'), 'Syntax error tidak menampilkan baris sumber.');
      pass('Syntax error dengan nomor baris');

      bridge.editor.setValue('console.log("tersimpan");');
      click('#btn-toggle-editor');
      const stored = JSON.parse(win.localStorage.getItem('ceoByCode_scripts'));
      assert(stored.scripts.find(script => script.id === first.id).code === 'console.log("tersimpan");', 'Buffer tidak disimpan saat ditutup.');
      click('#btn-toggle-editor');
      pass('Persistensi buffer saat sidebar ditutup');

      click('#btn-journal');
      assert(scene.panelManager.current === 'journal-panel' && bridge.isEditorVisible, 'Jurnal mengambil alih sidebar.');
      click('#journal-panel [data-close-panel]');
      assert(!scene.isModalOpen && bridge.isEditorVisible, 'Penutupan Jurnal mengunci sidebar.');
      pass('Jurnal tetap modal tersendiri');
      output.textContent += 'LULUS: 10 pemeriksaan browser.\n';
    } catch (error) {
      output.textContent += `GAGAL: ${error.stack || error}\n`;
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
